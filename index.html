<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Art: Comfort Food Squad 🍙🧋🥟🍲🍡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sunburst"></div>
  <h1 class="title">COMFORT FOOD SQUAD!</h1>

  <div class="squad">

    <!-- ONIGIRI -->
    <div class="card">
      <div class="character onigiri" data-name="onigiri">
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>
        <div class="sparkle sp3"></div>
        <div class="sparkle sp4"></div>

        <div class="rice"></div>
        <div class="nori"></div>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <p class="label">Onigiri</p>
    </div>

    <!-- BOBA TEA -->
    <div class="card">
      <div class="character boba" data-name="boba">
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>
        <div class="sparkle sp3"></div>
        <div class="sparkle sp4"></div>

        <div class="straw"></div>
        <div class="lid"></div>
        <div class="cup">
          <div class="pearls">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <p class="label">Boba Tea</p>
    </div>

    <!-- GYOZA -->
    <div class="card">
      <div class="character gyoza" data-name="gyoza">
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>
        <div class="sparkle sp3"></div>
        <div class="sparkle sp4"></div>

        <div class="dumpling"></div>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <p class="label">Gyoza</p>
    </div>

    <!-- HOT POT -->
    <div class="card">
      <div class="character hotpot" data-name="hotpot">
        <div class="steam-wrap">
          <span class="steam s1"></span>
          <span class="steam s2"></span>
          <span class="steam s3"></span>
        </div>
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>

        <div class="handle handle-left"></div>
        <div class="handle handle-right"></div>
        <div class="pot">
          <span class="veggie mushroom"></span>
          <span class="veggie leaf"></span>
          <span class="veggie meat"></span>
        </div>
        <div class="band"></div>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <p class="label">Hot Pot</p>
    </div>

    <!-- MOCHI -->
    <div class="card">
      <div class="character mochi" data-name="mochi">
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>
        <div class="sparkle sp3"></div>
        <div class="sparkle sp4"></div>

        <div class="dough"></div>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <p class="label">Mochi</p>
    </div>

  </div>

  <p class="hint">✨ click any of them ✨</p>

  <script src="script.js"></script>
</body>
</html>
