<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Art: Comfort Food Squad 🍙🧋🥟🍡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="restaurant">

    <div class="sign">COMFORT FOOD</div>

    <div class="screen">
      <div class="scanlines"></div>
      <p class="subtitle">— tap to order —</p>

      <div class="squad">

        <!-- ONIGIRI -->
        <div class="card">
          <div class="character onigiri" data-name="onigiri">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="rice"></div>
            <div class="nori"></div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Onigiri <span class="price">$4.50</span></p>
        </div>

        <!-- BOBA TEA -->
        <div class="card">
          <div class="character boba" data-name="boba">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="straw"></div>
            <div class="lid"></div>
            <div class="cup">
              <div class="pearls">
                <span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Boba Tea <span class="price">$5.25</span></p>
        </div>

        <!-- GYOZA -->
        <div class="card">
          <div class="character gyoza" data-name="gyoza">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="dumpling"></div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Gyoza <span class="price">$6.00</span></p>
        </div>

        <!-- MOCK TERMINAL -->
        <div class="card card-terminal">
          <div class="terminal">
            <div class="term-bar">
              <span class="dot dot-red"></span>
              <span class="dot dot-yellow"></span>
              <span class="dot dot-green"></span>
              <span class="term-title">order.sh</span>
            </div>
            <div class="term-body">
              <p><span class="prompt">$</span> order --dish onigiri</p>
              <p class="term-out">serving... done <span class="ok">✓</span></p>
              <p><span class="prompt">$</span> order --dish mochi</p>
              <p class="term-out">serving... done <span class="ok">✓</span></p>
              <p><span class="prompt">$</span> <span class="cursor"></span></p>
            </div>
          </div>
          <p class="label">System <span class="price">online</span></p>
        </div>

        <!-- MOCHI -->
        <div class="card">
          <div class="character mochi" data-name="mochi">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="dough"></div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Mochi <span class="price">$3.50</span></p>
        </div>

      </div>

      <p class="hint">✨ tap any dish to see it react ✨</p>
    </div>

    <div class="counter"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
