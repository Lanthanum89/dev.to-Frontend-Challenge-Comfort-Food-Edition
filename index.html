<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Art: A Bowl of Ramen 🍜</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene">
    <h1 class="title">A Bowl of Ramen</h1>

    <div class="bowl-wrap">
      <div class="steam-wrap">
        <span class="steam s1"></span>
        <span class="steam s2"></span>
        <span class="steam s3"></span>
      </div>
      <div class="bowl">
        <div class="broth">
          <div class="noodles">
            <span class="noodle n1"></span>
            <span class="noodle n2"></span>
            <span class="noodle n3"></span>
            <span class="noodle n4"></span>
            <span class="noodle n5"></span>
          </div>

          <div class="egg">
            <div class="egg-yolk"></div>
          </div>

          <div class="naruto"></div>

          <div class="scallions">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="nori"></div>

          <div class="corn">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="bowl-rim"></div>
      </div>
      <div class="chopsticks">
        <span class="stick stick1"></span>
        <span class="stick stick2"></span>
      </div>
      <div class="shadow"></div>
    </div>
  </main>
</body>
</html>
