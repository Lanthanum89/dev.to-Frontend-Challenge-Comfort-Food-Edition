<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Art: Kawaii Onigiri 🍙</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sunburst"></div>
  <h1 class="title">ONIGIRI!</h1>

  <div class="stage">
    <div class="onigiri-wrap" id="onigiri">
      <div class="sparkle sp1"></div>
      <div class="sparkle sp2"></div>
      <div class="sparkle sp3"></div>
      <div class="sparkle sp4"></div>

      <div class="rice"></div>
      <div class="nori"></div>

      <div class="face" id="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <p class="hint">✨ click the onigiri ✨</p>

  <script src="script.js"></script>
</body>
</html>
