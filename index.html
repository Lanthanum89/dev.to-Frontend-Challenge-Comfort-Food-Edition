<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Art: Comfort Food Squad 🍙🧋🥟🍲</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="restaurant">

    <div class="sign">COMFORT FOOD</div>

    <div class="screen">
      <div class="scanlines"></div>
      <p class="subtitle">— tap to order —</p>

      <div class="squad">

        <!-- ONIGIRI -->
        <div class="card">
          <div class="character onigiri" data-name="onigiri">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="rice"></div>
            <div class="nori"></div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Onigiri <span class="price">$4.50</span></p>
        </div>

        <!-- BOBA TEA -->
        <div class="card">
          <div class="character boba" data-name="boba">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="straw"></div>
            <div class="lid"></div>
            <div class="cup">
              <div class="pearls">
                <span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Boba Tea <span class="price">$5.25</span></p>
        </div>

        <!-- GYOZA -->
        <div class="card">
          <div class="character gyoza" data-name="gyoza">
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>
            <div class="sparkle sp3"></div>
            <div class="sparkle sp4"></div>

            <div class="dumpling"></div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Gyoza <span class="price">$6.00</span></p>
        </div>

        <!-- HOT POT -->
        <div class="card">
          <div class="character hotpot" data-name="hotpot">
            <div class="steam-wrap">
              <span class="steam s1"></span>
              <span class="steam s2"></span>
              <span class="steam s3"></span>
            </div>
            <div class="sparkle sp1"></div>
            <div class="sparkle sp2"></div>

            <div class="handle handle-left"></div>
            <div class="handle handle-right"></div>
            <div class="pot">
              <span class="veggie mushroom"></span>
              <span class="veggie leaf"></span>
              <span class="veggie meat"></span>
            </div>
            <div class="band"></div>

            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="cheek left"></div>
              <div class="cheek right"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <p class="label">Hot Pot <span class="price">$9.00</span></p>
        </div>

      </div>

      <!-- TOUCHSCREEN ORDER KIOSK -->
      <div class="kiosk">
        <p class="kiosk-heading">Self-Order Kiosk</p>
        <p class="kiosk-line typewriter">
          <span class="typed">Can I take your order?</span>
        </p>
        <div class="kiosk-button">
          <span>TAP TO ORDER</span>
          <span class="ripple"></span>
        </div>
        <div class="kiosk-ticket">
          <span class="ticket-label">Your order number</span>
          <span class="ticket-number">
            <span class="digit d1">0</span><span class="digit d2">4</span><span class="digit d3">2</span>
          </span>
          <span class="ticket-jag"></span>
        </div>
      </div>

      <p class="hint">✨ tap any dish to see it react ✨</p>
    </div>

    <div class="counter"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
